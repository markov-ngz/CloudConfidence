{% extends 'core/base.html' %}
{% block title %} {{ title }} {% endblock %}
{% block content %}
<div class="w-1/2 p-6 mu-6 mx-auto bg-gray-100 rounded-xl">
    <h1 class="mb-6 text-3xl"> {{ title }} </h1>
    <form method="post" action="." enctype="multipart/form-data" >
        {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <!-- <div class="mb-3">
                <label class="inline-block" mb-2> Product Name </label> <br>
                {{ form.name }}
            </div>
            <div class="mb-3">
                <label class="inline-block" mb-2> Category </label><br>
                {{ form.category }}
            </div>
            <div class="mb-3">
                <label class="inline-block mb-2" mb-2> Description </label><br>
                {{ form.description }}
            </div>
            <div class="mb-3">
                <label class="inline-block mb-2" mb-2> Price </label><br>
                {{ form.price }}
            </div>
            <div class="mb-3">
                <label class="inline-block mb-2" mb-2> Image </label><br>
                {{ form.image }}
            </div> !-->

            {% if form.errors or form.non_field_errors %}
                <div class="mb-3 p-6 bg-red-100 rounded-xl">
                    {%for field in form %}
                        {{ field.errors}}
                    {% endfor %}
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

        <button class=" mt-6 py-4 px-8 text-lg bg-teal-500 hover:bg-teal-700 rounded-xl text-white"> Submit </button>
    </form>

</div>
{% endblock %}
