{% extends 'core/base.html' %}
{% block title %} Items {% endblock %}
{% block content %}
    <div class=" pb-6 grid grid-cols-4 gap-4 bg-gray-100">
        <div class="col-span-1"> 
            <form action="{% url 'item:items' %}" method="get" class="mt-3 px-3">
                <input type="text" name="query" class="w-full py-4 px-6 border rounded-xl mt-4" value="{{ query }}" placeholder="Solaires, Vues, Lentilles">
                <button class="mt-12 py-4 px-8 text-lg bg-teal-500 text-white rounded-xl"> Search </button>
            </form>

            <hr class="my-6">
            <p class="font-semibold px-2">Categories </p>
            <ul>
                {% for category in categories %}
                    <li class="py-2 px-4 rounded-xl {% if category.id == category_id %} bg-gray-200 {% endif %}">
                        <a href="{% url 'item:items' %}?query={{query}}&category_id={{category.id}}">{{category.name}}</a>
                    </li>
                {% endfor %}
            </ul>

            <hr class="my-6">
            <ul>
                <li><a href="{% url 'item:items' %}" class="mt-2 py-4 px-4 inline-block bg-yellow-500 text-lg rounded-xl text-white ml-2"> Clear Filters </a></li>
            </ul>
        </div>
        <div class="col-span-3">
            {% for item in items %}
            <div>
                <a href="{% url 'item:detail' item.id %}">
                    <div>
                        <img src="{{ item.image.url }}" alt="" class="rounded-t-xm">
                    </div>

                    <div class="p-6 bg-white rounded-b-xl">
                        <h2 class="text-2xl"> {{ item.name }}</h2>
                        <p class="text-gray-500"> Price : {{item.price }}</p>
                    </div>
                </a>
            </div>
        {% endfor %}
        </div>
    </div>
{% endblock %}
