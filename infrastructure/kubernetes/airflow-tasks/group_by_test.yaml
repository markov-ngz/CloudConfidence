apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: airflow-tasks
spec:
  type: Java
  mode: cluster
  image: "spark-iceberg-aws:0.1.0"
  imagePullPolicy: Never
  sparkVersion: "4.1.3"
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.13-4.1.3.jar"
  mainClass: org.apache.spark.examples.GroupByTest
  # Arguments: <numMappers> <numKVPairs> <valSize> <numReducers>
  arguments:
    - "10"
    - "100000"
    - "1000"
    - "10"
  sparkConf:
    # Celeborn Shuffle Manager Settings
    spark.shuffle.manager: "org.apache.spark.shuffle.celeborn.SparkShuffleManager"
    spark.shuffle.sort.io.plugin.class: "org.apache.spark.shuffle.celeborn.CelebornShuffleDataIO"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"
    spark.celeborn.master.endpoints: "celeborn-master-0.celeborn-master-svc.celeborn:9097"

    # Disable Spark ESS (Celeborn handles shuffle storage)
    spark.shuffle.service.enabled: "false"

    # Disable replication for single-worker testing
    spark.celeborn.client.push.replicate.enabled: "false"

    # Dynamic Allocation Configurations
    spark.dynamicAllocation.enabled: "true"
    spark.dynamicAllocation.minExecutors: "0"
    spark.dynamicAllocation.maxExecutors: "2"
    spark.dynamicAllocation.executorIdleTimeout: "30s"

    # Must be false when using Celeborn Remote Shuffle Service
    spark.dynamicAllocation.shuffleTracking.enabled: "false"

    # AQE Configurations
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.localShuffleReader.enabled: "false"
    spark.sql.adaptive.skewJoin.enabled: "true"

  # As there is only one queue , it can be omitted
  #  batchSchedulerOptions:
  #    queue: root.default
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "513m"
    labels:
      version: 4.1.3
    serviceAccount: spark-operator-spark
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 4.1.3
  monitoring:
    exposeDriverMetrics: true
    exposeExecutorMetrics: true
    prometheus:
      jmxExporterJar: "/opt/spark/jars/jmx_prometheus_javaagent-1.1.0.jar"
      port: 8090