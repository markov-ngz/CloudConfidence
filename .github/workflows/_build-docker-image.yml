name: Dockerfile analysis directory

#  1. Lint dockerfile
#  2. Build the image
#  3. Scan its vulnerabilities
#  4. Push the image to registry

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
      application-name:
        type: string
        description: required to provide unique artifact name
      image-registry:
        type: string
        required: true
      tag:
        type: string
        required: false
        description: Will be set as image tag instead of short sha
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_SECRET:
        required: true

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: ${{ inputs.working-directory }}/Dockerfile
          failure-threshold: warning

  build-docker-image:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.docker-image.outputs.docker-image }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      # Source - https://stackoverflow.com/a
      # Posted by Lars Grammel
      # Retrieved 2026-01-28, License - CC BY-SA 4.0
      - name: Add SHORT_SHA env property with commit short sha
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - id: docker-image # Docker image name
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "docker-image=${{ inputs.image-registry }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "docker-image=${{ inputs.image-registry }}:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: '${{ steps.docker-image.outputs.docker-image }}'
          format: 'github'
          output: 'dependency-results.sbom.json'
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          severity: "MEDIUM,HIGH,CRITICAL"

      - name: Upload trivy report as a Github artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sbom-report-${{ inputs.application_name }}
          path: '${{ github.workspace }}/dependency-results.sbom.json'

      - name: Build docker image
        run: docker build -t ${{ steps.docker-image.outputs.docker-image }} ${{ inputs.working-directory }}

      - name: Push docker image
        run: docker push ${{ steps.docker-image.outputs.docker-image }}